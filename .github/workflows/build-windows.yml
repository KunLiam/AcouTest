name: Build Windows EXE

# 在 GitHub 云端的 Windows 机器上跑 PyInstaller，产出与 Packager.bat 等价的 onefile exe。
# macOS 无法交叉编译 Windows exe，本 workflow 用来替代本地 Packager.bat。
on:
  push:
    branches:
      - master_freebox
    paths-ignore:
      - "**/*.md"
      - "release_notes.txt"
  workflow_dispatch:

permissions:
  contents: write # 需要写权限才能创建/更新 Release 并上传 exe

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 只取根目录代码 + logo（audio/wakeup_count 等大资源打包不需要，跳过可大幅加快 checkout）
      - name: Checkout (sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            logo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pygame pillow certifi edge-tts aiohttp imageio-ffmpeg

      - name: Read APP_VERSION
        id: ver
        run: |
          $v = python -c "from feature_config import APP_VERSION; print(APP_VERSION)"
          if (-not $v) { throw "无法从 feature_config.py 读取 APP_VERSION" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "exe_name=AcouTest.v$v" >> $env:GITHUB_OUTPUT
          Write-Host "[CI] APP_VERSION = $v"

      # 参数与 Packager.bat 的 PyInstaller 调用保持一致（onefile / noconsole / noupx / 同一组 hidden-import）
      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --clean --noconsole --onefile --noupx `
            --icon "logo/AcouTest.ico" `
            --add-data "logo;logo" `
            --hidden-import certifi `
            --hidden-import updater_http `
            --hidden-import generate_wake_word `
            --hidden-import edge_tts `
            --hidden-import edge_tts.exceptions `
            --hidden-import imageio_ffmpeg `
            --hidden-import asyncio `
            --hidden-import asyncio.windows_events `
            --hidden-import asyncio.windows_utils `
            --hidden-import aiohttp `
            --exclude-module numpy `
            --name "${{ steps.ver.outputs.exe_name }}" `
            main.py

      - name: Verify output
        run: |
          $exe = "dist/${{ steps.ver.outputs.exe_name }}.exe"
          if (-not (Test-Path $exe)) { throw "打包失败：未生成 $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "[CI] Build OK: $exe ($mb MB)"

      # Artifact 是 zip 包，Chrome 安全浏览常直接拦掉，仅作备份保留
      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: AcouTest-windows-v${{ steps.ver.outputs.version }}-${{ github.sha }}
          path: dist/${{ steps.ver.outputs.exe_name }}.exe
          if-no-files-found: error
          retention-days: 30

      # 发到滚动预发布 tag `ci-<分支名>`，给出公开直链（不占用正式版 v<版本号> tag）
      - name: Publish to rolling pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pwsh 7.4 默认把外部命令非零退出当异常抛出，这里关掉，改为手工判 $LASTEXITCODE
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = "ci-${{ github.ref_name }}"
          $exe = "dist/${{ steps.ver.outputs.exe_name }}.exe"

          # 先删旧的同名预发布（含 tag），保证附件始终是本次构建的产物；首次运行时删除失败属正常
          gh release delete $tag --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) { Write-Host "[CI] 预发布 $tag 不存在或删除失败，继续新建" }

          $notes = @"
          分支 ``${{ github.ref_name }}`` 的最新云端构建，**非正式发布版**。

          - APP_VERSION: ``${{ steps.ver.outputs.version }}``
          - commit: ${{ github.sha }}
          - 构建记录: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          固定下载直链（每次构建覆盖为最新）：
          ``${{ github.server_url }}/${{ github.repository }}/releases/download/$tag/${{ steps.ver.outputs.exe_name }}.exe``

          exe 未做代码签名，浏览器或 Windows SmartScreen 可能提示未知发布者，选择保留/仍要运行即可。
          "@

          gh release create $tag $exe `
            --prerelease `
            --target ${{ github.sha }} `
            --title "CI 构建 v${{ steps.ver.outputs.version }} (${{ github.ref_name }})" `
            --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create 失败（退出码 $LASTEXITCODE）" }

          Write-Host "[CI] 下载直链: ${{ github.server_url }}/${{ github.repository }}/releases/download/$tag/${{ steps.ver.outputs.exe_name }}.exe"
